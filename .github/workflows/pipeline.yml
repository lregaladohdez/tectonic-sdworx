# Security → test → deploy. One pipeline, three gates.
#
#   security  Aikido scan of the commit (fails on new HIGH/CRITICAL dependency findings)
#   test      npm audit, typecheck, lint, unit tests, production build
#   deploy    main only, after both gates: Cloud Build image → Cloud Run (europe-west1),
#             then a smoke test against the new revision with an identity token.
#
# GitHub auth to Google Cloud is keyless (Workload Identity Federation): no service-account
# key is stored anywhere. One-time setup: scripts/gcp/setup-github-deploy.sh, then set the
# repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT, and the
# repository secret AIKIDO_SECRET_KEY (Aikido → Settings → Integrations → CI).
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT: qwiklabs-gcp-02-8ec6a39cdba0
  GCP_REGION: europe-west1
  AR_REPO: apps
  SERVICE: tectonic-sdworx

jobs:
  security:
    name: Security (Aikido)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # scan summary on PRs
    steps:
      - uses: actions/checkout@v4
      - name: Aikido scan
        uses: AikidoSec/github-actions-workflow@v1.0.13
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          minimum-severity: "HIGH"
          fail-on-timeout: true
          fail-on-dependency-scan: true
          fail-on-sast-scan: false # paid-plan feature
          fail-on-iac-scan: false # paid-plan feature
          timeout-seconds: 300
          post-scan-status-comment: "only_if_new_findings"
          post-sast-review-comments: "off"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [security, test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/$SERVICE:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --tag "$IMAGE" --timeout=1500 .

      - name: Deploy revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          # Only non-secret config here. Secrets are bound once with
          # `gcloud run services update --update-secrets` and carry over between revisions.
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT }}
            GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }}
          flags: --memory=4Gi --cpu=2 --timeout=600 --concurrency=4
          # Invoker IAM is deliberately not managed here; see README "Deploy".

      - name: Identity token for the smoke test
        id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          for path in / /login; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL$path")
            echo "$path -> $code"
            case "$code" in 200|307) ;; *) echo "unexpected status for $path"; exit 1 ;; esac
          done
