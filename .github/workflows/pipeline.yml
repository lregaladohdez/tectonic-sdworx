# Local repair under SECURITY HOLD: test and build only. Deployment is disabled.
#
#   test      runtime audit (high+), full audit (high+), typecheck, lint,
#             unit tests, production build
#   deploy    retained for separate review, but cannot run on push, PR or dispatch.
#             A later deployment needs separate authorization and a reviewed gate.
#
# The connected Aikido GitHub App posts a pull-request check. A successful check is
# not an approval to merge or deploy; enforcement also requires repository rules.
# Those rules were not active on upstream main during the 9 Nov 2026 source review. Aikido
# refuses its GitHub Action on a repo the App already protects (HTTP 422), so there is no
# scan job here on purpose. Make the App's check "required" in branch protection for main.
#
# This workflow uses Workload Identity Federation and configures no service-account key.
# Historical setup: scripts/gcp/setup-github-deploy.sh, then set the
# repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT: qwiklabs-gcp-02-8ec6a39cdba0
  GCP_REGION: europe-west1
  AR_REPO: apps
  SERVICE: tectonic-sdworx

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (high+)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run (SECURITY HOLD)
    # No environment flag, API key, green CI or workflow dispatch lifts this HOLD.
    if: ${{ false }}
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (keyless)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Build image with Cloud Build
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/$SERVICE:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --tag "$IMAGE" --timeout=1500 .

      - name: Deploy revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          project_id: ${{ env.GCP_PROJECT }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          # Only non-secret config here. Secrets are bound once with
          # `gcloud run services update --update-secrets` and carry over between revisions.
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT }}
            GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }}
          flags: --memory=4Gi --cpu=2 --timeout=600 --concurrency=4
          # Invoker IAM is deliberately not managed here; see README "Deploy".

      - name: Identity token for the smoke test
        id: idtoken
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          for path in / /login; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL$path")
            echo "$path -> $code"
            case "$code" in 200|307) ;; *) echo "unexpected status for $path"; exit 1 ;; esac
          done
